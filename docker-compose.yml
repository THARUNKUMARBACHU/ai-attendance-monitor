# The whole system on one machine: PostgreSQL, Redis and Qdrant, a one-shot database setup, the API
# (which also serves the UI at /ui/) and the ingestion worker.
#
#   cp .env.docker.example .env.docker        # then change the passwords and JWT_SECRET
#   docker compose up -d --build
#   open http://127.0.0.1:8000/ui/
#
# The app containers get their settings only from .env.docker (env_file) and the environment blocks
# below. This file has no ${...} interpolation on purpose: Docker Compose reads a file named .env in
# this folder for interpolation, and here that file holds the cloud settings used outside Docker.
# Compose still reads .env for its own COMPOSE_* options, but no value from it reaches a container.

name: attendance-ai

# One image for the setup job, the API and the worker. It is built from this folder, never pulled.
x-app: &app
  image: attendance-ai:local
  build: .
  pull_policy: never
  env_file: .env.docker
  init: true

# The stores of this project and the image's folders. These win over any value in .env.docker.
x-stores: &stores
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ""
  STORAGE_DIR: /app/var/storage
  MODEL_CACHE_DIR: /opt/models

x-app-depends-on: &app-depends-on
  setup:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  qdrant:
    condition: service_healthy

services:
  postgres:
    image: postgres:17
    # Only POSTGRES_PASSWORD is used from this file, and only when the data volume is first created.
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while the first start initialises the database, the server listens on its socket only.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Append-only file, so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget, so ask /readyz through bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Creates the roles and the database, runs the migrations and applies the grants, then exits.
  # Idempotent: it runs again on every `docker compose up`.
  setup:
    <<: *app
    command: ["python", "scripts/db_setup.py"]
    environment:
      <<: *stores
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "attendance_ai.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *stores
      # The running services never hold the administrator or owner credentials; only setup does.
      DATABASE_ADMIN_URL: ""
      DATABASE_OWNER_URL: ""
    ports:
      # Localhost only: dev sign-in is on, so the API must not be reachable from other machines.
      - "127.0.0.1:8000:8000"
    volumes:
      - storage:/app/var/storage
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "attendance_ai.worker"]
    environment:
      <<: *stores
      DATABASE_ADMIN_URL: ""
      DATABASE_OWNER_URL: ""
    # The same volume as the API: the API stores the uploads, the worker reads them.
    volumes:
      - storage:/app/var/storage
    depends_on: *app-depends-on
    # Time to finish the current step on shutdown; an interrupted job is re-queued by the next sweep.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  qdrant-data:
  storage:
