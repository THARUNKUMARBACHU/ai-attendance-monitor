[project]
name = "attendance-ai"
version = "0.1.0"
description = "Attendance Intelligence: a multi-tenant RAG microservice for attendance evidence."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "dramatiq[redis]>=1.17",
    "fastapi>=0.115",
    "fastembed>=0.8.1",
    "httpx>=0.27",
    "openai>=3.19.2",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "redis>=5.0",
    "reportlab>=4.2",
    "sqlalchemy>=2.0.35",
    "sqlglot>=30.20.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attendance_ai"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"migrations/**" = ["S608", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["dramatiq", "dramatiq.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a PostgreSQL server (set TEST_DATABASE_ADMIN_URL)"]
